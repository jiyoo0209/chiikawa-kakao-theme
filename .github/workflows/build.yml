name: 테마 APK 빌드

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 사진 적용
        run: |
          pip install --quiet pillow
          python scripts/apply_images.py

      - name: APK 빌드
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PbuildNumber=${{ github.run_number }} --no-daemon

      - name: 파일 이름 정리
        id: apk
        run: |
          ID=$(grep '^packageId=' theme.properties | cut -d= -f2 | tr -d '[:space:]')
          mkdir -p out
          FILE="out/${ID}-theme-${{ github.run_number }}.apk"
          cp build/outputs/apk/release/*-release.apk "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: kakao-theme-apk
          path: out/*.apk

      - name: Releases 에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" "${{ steps.apk.outputs.file }}" \
            --title "테마 빌드 #${{ github.run_number }}" \
            --notes "폰에서 아래 .apk 파일을 눌러 다운로드 → 설치 → 앱 열기 → [테마 적용하기]" \
            --latest
