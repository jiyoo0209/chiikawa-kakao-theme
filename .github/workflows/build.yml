name: 테마 APK 빌드

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 사진 적용
        run: |
          pip install --quiet pillow
          python scripts/apply_images.py

      - name: APK 빌드
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PbuildNumber=${{ github.run_number }} --no-daemon

      - name: 파일 이름 정리
        id: apk
        run: |
          NAME=$(grep '^apkName=' theme.properties | cut -d= -f2 | tr -d '[:space:]')
          mkdir -p out
          FILE="out/${NAME:-kakao-theme}.apk"
          cp build/outputs/apk/release/*-release.apk "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          # iOS 용 테마(.ktheme, zip 형식)도 같이 만듦
          python scripts/build_ios.py "out/${NAME:-kakao-theme}.ktheme"
          echo "ios=out/${NAME:-kakao-theme}.ktheme" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: kakao-theme-${{ github.ref_name }}
          path: |
            out/*.apk
            out/*.ktheme

      - name: Releases 에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${{ github.ref_name }}"
          SAFE=$(printf '%s' "$BRANCH" | tr -c 'A-Za-z0-9._-' '-')
          if [ "$BRANCH" = "main" ]; then TAG="build-${{ github.run_number }}"; LATEST=true; else TAG="${SAFE}-${{ github.run_number }}"; LATEST=false; fi
          gh release create "$TAG" "${{ steps.apk.outputs.file }}" "${{ steps.apk.outputs.ios }}" \
            --target "${{ github.sha }}" \
            --title "[$BRANCH] 테마 빌드 #${{ github.run_number }}" \
            --notes "안드로이드: .apk 다운로드 → 설치 → 앱 열기 → [테마 적용하기] / 아이폰: .ktheme 다운로드 → 카카오톡으로 열기" \
            --latest=$LATEST
